apply plugin: 'com.android.application'

android {
    namespace "uk.org.planik.app"
    compileSdk 35

    defaultConfig {
        applicationId "uk.org.planik.app"
        minSdk 28
        targetSdk 35
        versionCode 2
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    google()
    mavenCentral()
}

// Auto-generated by Capacitor — wires in every installed plugin (including
// @capacitor-mlkit/barcode-scanning) so its native code is reachable.
apply from: 'capacitor.build.gradle'

dependencies {
    // Capacitor core
    implementation project(':capacitor-android')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    // Health Connect SDK for step data
    implementation 'androidx.health.connect:connect-client:1.1.0-alpha10'

    // Kotlin coroutines (required for Health Connect async calls)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-jdk8:1.8.1'
}
